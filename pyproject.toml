[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenixengine-apex"
version = "0.1.0"
description = "PhoenixEngine Apex Edition Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
au = "au.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json"]
