markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search
  - minify

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hydrogenesi/Phoenix-2.0-Apex-Edition
